api_version: 1.0

# Keep wrist roll fixed so position-only IK cannot rotate the jaw plane.
cspace:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex

root_link: base_link
default_q: [0.0, 0.0, 0.0, 0.0]

acceleration_limits: [4.0, 4.0, 4.0, 5.0]
jerk_limits: [40.0, 40.0, 40.0, 50.0]

cspace_to_urdf_rules:
    - {name: wrist_roll, rule: fixed, value: 0.0}
    - {name: gripper, rule: fixed, value: 0.0}

collision_spheres: []
